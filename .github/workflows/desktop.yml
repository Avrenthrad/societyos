# Builds the desktop installers (Mac, Windows, Linux) and attaches them to a
# GitHub release. The desktop app shows the live web app, so it only needs
# rebuilding when the desktop shell itself changes.
name: Desktop

on:
  push:
    branches: [main]
    paths:
      - "apps/today/src-tauri/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/today/src-tauri -> target
      - name: Linux build tools
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/today
          tauriScript: pnpm tauri
          tagName: today-desktop-v__VERSION__
          releaseName: SocietyOS Today desktop v__VERSION__
          releaseBody: Download the installer for your computer below.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
